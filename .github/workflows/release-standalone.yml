name: release-standalone
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - name: Build standalone
        run: bun run build
        env:
          DOCKER_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Package
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo '::error::Tag must match package.json version'; exit 1
          fi
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          find .next/standalone -maxdepth 1 -name '.env*' -delete
          mkdir -p dist
          tar -czf "dist/cineisle-$VERSION-linux-x64.tar.gz" -C .next/standalone .
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: standalone-linux-x64
          path: dist/
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' 'CineIsle, independently maintained by ForXd.' '' 'Code originally based on LibreSpark/LibreTV (https://github.com/LibreSpark/LibreTV), licensed under AGPL-3.0-or-later.' '' 'Runtime: Bun 1.4.4 on Linux x64. Extract and run PASSWORD=your-password PORT=8080 bun server.js.' > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "CineIsle $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
